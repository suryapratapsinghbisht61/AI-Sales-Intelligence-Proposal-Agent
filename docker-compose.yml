services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: salespilot
      POSTGRES_PASSWORD: salespilot
      POSTGRES_DB: salespilot
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U salespilot"]
      interval: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports: ["9000:9000", "9001:9001"]
    volumes: [miniodata:/data]
    profiles: [s3]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://salespilot:salespilot@db:5432/salespilot
    ports: ["8000:8000"]
    depends_on: { db: { condition: service_healthy } }
    profiles: [app]

  worker:
    build: ./backend
    command: python -m app.worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://salespilot:salespilot@db:5432/salespilot
    depends_on: { db: { condition: service_healthy } }
    profiles: [app]

volumes:
  pgdata:
  miniodata:
