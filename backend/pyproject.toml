[project]
name = "salespilot-backend"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi",
  "uvicorn[standard]",
  "sqlalchemy>=2",
  "psycopg[binary]",
  "alembic",
  "pgvector",
  "pydantic-settings",
  "email-validator",
  "argon2-cffi",
  "python-multipart",
  "httpx",
  "beautifulsoup4",
  "pypdf",
  "python-docx",
  "openpyxl",
  "boto3",
  "langchain",
  "langchain-text-splitters",
  "langgraph",
  "langchain-anthropic",
  "langchain-openai",
  "langchain-ollama",
]

[dependency-groups]
dev = [
    "numpy>=2.5.4",
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
